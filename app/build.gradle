plugins {
    id 'com.android.application'
}

// 字符串加密。R8 只处理类名/方法名，dex 里的字符串常量原样保留 ——
// `strings classes.dex | grep http` 就能拿到 tracker 地址。
// 这个插件把字面量替换成密文，运行时用 StringFogImpl 解。
apply plugin: 'stringfog'

stringfog {
    enable true
    // mode 是**密文的编码方式**，不是算法（算法看 implementation）：
    //   base64  密文转 Base64，兼容性最稳
    //   bytes   直接存字节序列，省掉编解码开销，需要 5.x 运行时
    mode 'base64'
    // xor 是最轻的算法，挡 strings 够用。真要抗逆向得靠加壳。
    implementation 'com.github.megatronking.stringfog.xor.StringFogImpl'
    // kg 是 IKeyGenerator 对象（不是字符串），而且实现类在另一个 artifact 里。
    // 不写就用默认的 RandomKeyGenerator：每个字符串一个长度 8 的随机密钥，
    // 密钥随密文一起嵌在字节码里 —— 这是插件的设计，不影响正确性。
}

android {
    signingConfigs {
        // 固定签名。以前 CI 每次用 keytool 现场生成 debug.keystore，
        // 每次的 SHA256 都不一样 —— 结果就是"装新版必须先卸载"，
        // 因为 Android 拒绝签名不同的覆盖安装。
        // 现在用仓库里这份固定 keystore，签名永远一致，可以就地覆盖升级。
        stable {
            storeFile file('mintv.keystore')
            storePassword 'mintv2026'
            keyAlias 'mintv'
            keyPassword 'mintv2026'
        }
    }

    namespace 'com.mintv.tv'
    compileSdk 34

    buildFeatures {
        // StringFog 5.x 依赖 BuildConfig，AGP 8.0 起默认不生成
        buildConfig true
    }

    // 只为了编 libmintvcrypt.so（P2P 分片加密的密钥放里面）。
    // 版本跟 CI 上装的保持一致，不匹配会报 "NDK not configured"。
    ndkVersion '26.1.10909125'

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    defaultConfig {
        applicationId "com.mintv.tvui"
        // Android 4.4。下限由依赖决定，不是随便写的：
        //   media3-common / media3-exoplayer 的 AAR 声明 minSdk=19
        //   libvlc-all 3.x                   声明 minSdk=17
        // 两个一起用，卡在 19。要到 4.2.2(17) 就必须砍掉 media3。
        minSdk 19
        // 方法数已超 64K（media3 + libvlc + zxing + androidx.core）
        multiDexEnabled true
        targetSdk 34
        versionCode 275
        versionName "0.3.79"

        // native 只编 32 位 —— 跟下面的 splits 一致。
        // 注意：不能写在外层 ndk {} 里，那会跟 splits 冲突；
        // 放在 externalNativeBuild.cmake 下是允许的。
        externalNativeBuild {
            cmake {
                abiFilters 'armeabi-v7a'
                arguments '-DANDROID_STL=none'
                cFlags '-Os'
            }
        }

        // 注意：这里不能再写 ndk { abiFilters ... }。
        // AGP 会直接报 "Conflicting configuration : 'arm64-v8a,armeabi-v7a'
        // in ndk abiFilters cannot be present when splits abi filters are set"。
        // ABI 过滤统一由下面的 splits.abi.include 负责。
    }

    // 按 ABI 拆包。
    //
    // 一个包塞两套 so 时 82.9MB，其中 78.7MB 是 .so（94.9%），
    // 而任何一台设备只用得上其中一套。拆开后每个包小了将近一半，
    // 下载和安装都轻松很多。不要 universalApk（那等于没拆）。
    splits {
        abi {
            enable true
            reset()
            // 只出 32 位包。
            //
            // 原因：tvbus / pxp 的 SDK（libtvcore.so、libp2p.so 等）
            // 只有 armeabi-v7a 版本。而一个进程只能选一种 ABI ——
            // APK 里同时有 arm64 和 armv7 时系统永远先起 arm64 进程，
            // 在那个进程里加载 armv7 的 so 会直接 UnsatisfiedLinkError。
            //
            // 代价：软解性能比 64 位低 15~25%，4K 不要指望。
            // 1080p 及以下走硬解，和 64 位没有可感知差别。
            include 'armeabi-v7a'
            universalApk false
        }
    }

    buildTypes {
        // CI 构建的是 debug 变体，所以 debug 也必须指定固定签名。
        // 之前只给 release 配了 stable，debug 走了 AGP 默认的随机密钥 ——
        // 这才是"每次签名都不一样"的真正原因。
        debug {
            signingConfig signingConfigs.stable
            // CI 打的是 debug 包，不混淆的话 jadx 打开就是可读源码。
            // 混淆 + 资源压缩对调试没有实质影响（这个项目没有 XML 布局，
            // UI 全是代码画的），代价换来的是逆向门槛。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            shrinkResources true
            // native 库大量走 JNI 反射，混淆必然崩
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 固定签名，保证可以就地覆盖升级
            signingConfig signingConfigs.stable
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
    }

    // 必须保持 so 不压缩（STORED），这样它能被直接 mmap 加载。
    // 一旦压缩，解压副本会额外占一倍 data 空间，低端盒子上就是装不下。
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    // StringFog 运行时（零依赖纯 Java JAR）
    implementation 'com.github.megatronking.stringfog:xor:5.0.0'

    // 三个播放内核并存，UI 层零第三方依赖。切换逻辑在 PlayerManager。
    //
    // Exo：HLS/TS 最稳、起播最快，默认

    // media3-ui 只是控制条，本项目全自绘，不引入
    //


    // 二维码生成：只有 core，纯算法、无 Android UI 依赖（约 600KB）
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.multidex:multidex:2.0.1'

    // VLC：最后的兜底，格式覆盖最广。
    //
    // 关于 16KB 对齐：3.5.1 的 so 是 4KB 对齐（p_align=0x1000），
    // Android 15 会弹「未进行 16KB 对齐」的兼容性提示。
    // 3.7.7 修好了（p_align=0x4000），但它要求 compileSdk 36，
    // 现在的 AGP 8.5.2 只到 34，要连 Gradle 一起升 —— 那是独立的构建链改动，
    // 不跟"降到 4.4"混在一起做，两件事分两次验证。
    implementation 'org.videolan.android:libvlc-all:3.5.1'
    // QuickJS：脚本引擎。AAR 自带 arm64-v8a / armeabi-v7a / x86 / x86_64 全 ABI
    implementation 'io.github.taoweiji.quickjs:quickjs-android:1.4.6'
}
