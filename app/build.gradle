plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mintv.tv'
    compileSdk 34

    defaultConfig {
        applicationId "com.mintv.tvui"
        // Android 4.4。下限由依赖决定，不是随便写的：
        //   media3-common / media3-exoplayer 的 AAR 声明 minSdk=19
        //   libvlc-all 3.x                   声明 minSdk=17
        // 两个一起用，卡在 19。要到 4.2.2(17) 就必须砍掉 media3。
        minSdk 19
        targetSdk 34
        versionCode 70
        versionName "2.2.3"

        // 注意：这里不能再写 ndk { abiFilters ... }。
        // AGP 会直接报 "Conflicting configuration : 'arm64-v8a,armeabi-v7a'
        // in ndk abiFilters cannot be present when splits abi filters are set"。
        // ABI 过滤统一由下面的 splits.abi.include 负责。
    }

    // 按 ABI 拆包。
    //
    // 一个包塞两套 so 时 82.9MB，其中 78.7MB 是 .so（94.9%），
    // 而任何一台设备只用得上其中一套。拆开后每个包小了将近一半，
    // 下载和安装都轻松很多。不要 universalApk（那等于没拆）。
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // native 库大量走 JNI 反射，混淆必然崩
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 用 CI 生成的固定调试签名（口令 android/android），保证版本可覆盖升级
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
    }

    // 必须保持 so 不压缩（STORED），这样它能被直接 mmap 加载。
    // 一旦压缩，解压副本会额外占一倍 data 空间，低端盒子上就是装不下。
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    // 三个播放内核并存，UI 层零第三方依赖。切换逻辑在 PlayerManager。
    //
    // Exo：HLS/TS 最稳、起播最快，默认
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    // media3-ui 只是控制条，本项目全自绘，不引入
    // implementation 'androidx.media3:media3-ui:1.3.1'


    // VLC：最后的兜底，格式覆盖最广。
    //
    // 关于 16KB 对齐：3.5.1 的 so 是 4KB 对齐（p_align=0x1000），
    // Android 15 会弹「未进行 16KB 对齐」的兼容性提示。
    // 3.7.7 修好了（p_align=0x4000），但它要求 compileSdk 36，
    // 现在的 AGP 8.5.2 只到 34，要连 Gradle 一起升 —— 那是独立的构建链改动，
    // 不跟"降到 4.4"混在一起做，两件事分两次验证。
    implementation 'org.videolan.android:libvlc-all:3.5.1'
}
