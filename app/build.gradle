plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mintv.tv'
    compileSdk 34

    defaultConfig {
        applicationId "com.mintv.tvui"
        // TV 盒子覆盖最广的下限，Android 5.0
        minSdk 21
        targetSdk 34
        versionCode 21
        versionName "1.0.1"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 用 CI 生成的固定调试签名（口令 android/android），保证版本可覆盖升级
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // 仅播放内核用 Media3，UI 层零第三方依赖
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
}
