plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mintv.tv'
    compileSdk 34

    defaultConfig {
        applicationId "com.mintv.tvui"
        // TV 盒子覆盖最广的下限，Android 5.0
        minSdk 21
        targetSdk 34
        versionCode 43
        versionName "1.6.0"

        // 只打两个 ARM 变体：盒子没有 x86 真机。
        // 不过滤的话 libvlc 的 x86/x86_64 两个 so 会白塞进来 +47MB。
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    // 按 ABI 拆包。
    //
    // 一个包塞两套 so 时 82.9MB，其中 78.7MB 是 .so（94.9%），
    // 而任何一台设备只用得上其中一套。拆开后每个包小了将近一半，
    // 下载和安装都轻松很多。不要 universalApk（那等于没拆）。
    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a'
            universalApk false
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            // native 库大量走 JNI 反射，混淆必然崩
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // 用 CI 生成的固定调试签名（口令 android/android），保证版本可覆盖升级
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    packaging {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*']
        }
    }

    lint {
        abortOnError false
    }

    // 必须保持 so 不压缩（STORED），这样它能被直接 mmap 加载。
    // 一旦压缩，解压副本会额外占一倍 data 空间，低端盒子上就是装不下。
    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}

dependencies {
    // 三个播放内核并存，UI 层零第三方依赖。切换逻辑在 PlayerManager。
    //
    // Exo：HLS/TS 最稳、起播最快，默认
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    // media3-ui 只是控制条，本项目全自绘，不引入
    // implementation 'androidx.media3:media3-ui:1.3.1'


    // VLC：最后的兜底，格式覆盖最广。3.5.1 是 3.x 稳定线，4.0 还是 EAP
    implementation 'org.videolan.android:libvlc-all:3.5.1'
}
