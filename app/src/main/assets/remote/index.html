<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MinTV 遥控</title>
<link rel="stylesheet" href="app.css">
<style>
  .pad{position:relative;width:250px;height:250px;margin:18px auto 8px;
       border-radius:50%;background:var(--card);box-shadow:var(--shadow)}
  .pad .btn{position:absolute;display:flex;align-items:center;justify-content:center;
       width:78px;height:78px;border-radius:50%;color:var(--text)}
  .pad .btn:active{background:var(--hover)}
  .pad .up{left:86px;top:0}.pad .down{left:86px;bottom:0}
  .pad .left{left:0;top:86px}.pad .right{right:0;top:86px}
  .pad .ok{left:78px;top:78px;width:94px;height:94px;border-radius:50%;
       background:var(--hover);font-size:17px;font-weight:600}
  .pad svg{width:26px;height:26px}
  .pair{display:flex;gap:16px;margin-top:14px}
  .pair .col{flex:1;background:var(--card);border-radius:18px;box-shadow:var(--shadow);
       display:flex;flex-direction:column;align-items:center;padding:8px 0}
  .pair .col .k{width:100%;padding:14px 0;text-align:center;font-size:17px;color:var(--text)}
  .pair .col .k:active{background:var(--hover)}
  .pair .col .lbl{font-size:12px;color:var(--muted);letter-spacing:.12em;padding:4px 0}
  .digit{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
  .digit .d{background:var(--card);border-radius:14px;padding:16px 0;text-align:center;
       font-size:20px;color:var(--text);box-shadow:var(--shadow)}
  .digit .d:active{background:var(--hover)}
  .quick{display:flex;gap:14px;justify-content:center;margin-top:6px}
  .quick .q{width:54px;height:54px;border-radius:50%;background:var(--card);
       display:flex;align-items:center;justify-content:center;color:var(--text);
       box-shadow:var(--shadow)}
  .quick .q:active{transform:scale(.93)}
  .quick svg{width:22px;height:22px}
  .nowplaying .t{display:flex;align-items:baseline;gap:10px}
  .nowplaying .no{font-size:13px;padding:3px 9px;border-radius:6px;
       background:var(--blue-dim);color:var(--blue);font-variant-numeric:tabular-nums}
  .nowplaying .nm{font-size:19px;font-weight:600;color:var(--text)}
  .meta{display:flex;gap:14px;margin-top:8px;font-size:13px;color:var(--muted)}
  .bar{height:4px;border-radius:2px;background:var(--line);margin-top:12px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .4s}
  .toast{position:fixed;left:50%;bottom:38px;transform:translateX(-50%);
       background:rgba(20,20,24,.92);color:#fff;font-size:14px;padding:9px 18px;
       border-radius:20px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
  .toast.on{opacity:1}
</style>
</head>
<body>

<div class="head">
  <div class="grow">
    <h1>MinTV 遥控</h1>
    <div class="sub"><span class="dot" id="dot"></span><span id="conn">连接中…</span></div>
  </div>
  <button class="theme" data-theme-btn onclick="MintvTheme.cycle()">跟随系统</button>
</div>

<div class="card nowplaying">
  <div class="t"><span class="no" id="no">--</span><span class="nm" id="nm">未在播放</span></div>
  <div class="meta">
    <span id="line">线路 -/-</span><span id="res">--</span><span id="spd">--</span>
  </div>
  <div class="bar"><i id="prog"></i></div>
</div>

<div class="quick">
  <div class="q" onclick="cmd('MENU')" title="菜单">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </div>
  <div class="q" onclick="cmd('BACK')" title="返回">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
  </div>
  <div class="q" onclick="cmd('HOME')" title="主页">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/></svg>
  </div>
  <div class="q" onclick="cmd('MUTE')" title="静音">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l4 6M21 9l-4 6"/></svg>
  </div>
</div>

<div class="pad">
  <div class="btn up" onclick="cmd('UP')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
  </div>
  <div class="btn down" onclick="cmd('DOWN')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  </div>
  <div class="btn left" onclick="cmd('LEFT')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
  </div>
  <div class="btn right" onclick="cmd('RIGHT')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </div>
  <div class="btn ok" onclick="cmd('OK')">OK</div>
</div>

<div class="pair">
  <div class="col">
    <div class="k" onclick="cmd('CH_UP')">+</div>
    <div class="lbl">CH</div>
    <div class="k" onclick="cmd('CH_DOWN')">−</div>
  </div>
  <div class="col">
    <div class="k" onclick="cmd('VOL_UP')">+</div>
    <div class="lbl">VOL</div>
    <div class="k" onclick="cmd('VOL_DOWN')">−</div>
  </div>
</div>

<div class="digit">
  <div class="d" onclick="digit('1')">1</div><div class="d" onclick="digit('2')">2</div><div class="d" onclick="digit('3')">3</div>
  <div class="d" onclick="digit('4')">4</div><div class="d" onclick="digit('5')">5</div><div class="d" onclick="digit('6')">6</div>
  <div class="d" onclick="digit('7')">7</div><div class="d" onclick="digit('8')">8</div><div class="d" onclick="digit('9')">9</div>
  <div class="d" onclick="cmd('LINE')">线路</div><div class="d" onclick="digit('0')">0</div><div class="d" onclick="digitDel()">←</div>
</div>

<p class="sect">最近频道</p>
<div class="list" id="chans"></div>

<div class="toast" id="toast"></div>

<script src="theme.js"></script>
<script>
var buf = '';
var timer = null;

function toast(s) {
  var t = document.getElementById('toast');
  t.textContent = s; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('on'); }, 1500);
}

function cmd(type, value) {
  MintvApi.cmd(type, value).then(function (r) {
    if (!r || r.ok === false) toast((r && r.msg) || '操作失败');
    setTimeout(refresh, 260);
  }).catch(function () { toast('盒子没有响应'); });
}

// 数字键：在本地累计，1.2 秒不发就一起提交
function digit(d) {
  buf += d;
  document.getElementById('no').textContent = buf;
  clearTimeout(timer);
  timer = setTimeout(flushDigit, 1200);
}
function digitDel() {
  buf = buf.slice(0, -1);
  document.getElementById('no').textContent = buf || '--';
  clearTimeout(timer);
  if (buf) timer = setTimeout(flushDigit, 1200);
}
function flushDigit() {
  if (!buf) return;
  var v = buf; buf = '';
  MintvApi.cmd('DIGIT', v).then(function () { setTimeout(refresh, 500); });
}

function refresh() {
  MintvApi.state().then(function (s) {
    if (!s) return;
    document.getElementById('dot').className = 'dot ok';
    document.getElementById('conn').textContent =
        '已连接 · ' + (s.ip || '') + (s.port ? ':' + s.port : '');

    var ch = s.ch || {};
    document.getElementById('no').textContent = ch.no || '--';
    document.getElementById('nm').textContent = ch.name || '未在播放';

    var line = s.line || {};
    document.getElementById('line').textContent =
        '线路 ' + (line.cur || '-') + '/' + (line.total || '-');

    var v = s.video || {};
    document.getElementById('res').textContent = v.res || '--';
    document.getElementById('spd').textContent = s.speed || '--';

    var pg = s.program || {};
    var pct = Math.round((pg.progress || 0) * 100);
    document.getElementById('prog').style.width = pct + '%';
  }).catch(function () {
    document.getElementById('dot').className = 'dot';
    document.getElementById('conn').textContent = '连接断开';
  });
}

function renderChans(list) {
  var box = document.getElementById('chans');
  if (!list || !list.length) {
    box.innerHTML = '<div class="empty">盒子还没有加载频道</div>';
    return;
  }
  box.innerHTML = list.map(function (c, i) {
    return '<div class="item' + (i === 0 ? ' on' : '') + '" onclick="cmd(\'DIGIT\',\'' +
        String(c.no).replace(/^0+/, '') + '\')">' +
        '<span class="n">' + c.no + '</span><span class="grow">' + c.name + '</span>' +
        '<span class="n">' + (c.group || '') + '</span></div>';
  }).join('');
}

// 状态每秒刷一次；切后台自动停
MintvPoll(refresh, 1000);
// 频道列表变化不频繁，10 秒一次就够
MintvPoll(function () {
  MintvApi.state().then(function (s) { if (s && s.recent) renderChans(s.recent); });
}, 10000);
</script>
</body>
</html>
