<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MinTV · 遥控</title>
<link rel="stylesheet" href="app.css">
<style>
  /* ---- 正在播放 ---- */
  .np{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .np .no{font-size:12.5px;padding:3px 9px;border-radius:7px;
    background:var(--blue-dim);color:var(--blue);font-variant-numeric:tabular-nums}
  .np .nm{font-size:18px;font-weight:650;color:var(--text);flex:1;min-width:0;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .meta{display:flex;gap:14px;font-size:12.5px;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .bar{height:4px;border-radius:2px;background:var(--line);margin-top:13px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .5s}

  /* ---- 快捷圆钮 ---- */
  .quick{display:flex;justify-content:center;gap:14px;margin-bottom:4px}
  .quick .q{width:52px;height:52px;border-radius:50%;background:var(--card);
    display:flex;align-items:center;justify-content:center;color:var(--text);
    box-shadow:var(--shadow);transition:transform .12s,background .12s}
  .quick .q:active{transform:scale(.92);background:var(--hover)}
  .quick svg{width:21px;height:21px;stroke-width:1.9}

  /* ---- 方向盘 ---- */
  .pad{position:relative;width:212px;height:212px;margin:20px auto 8px;
    border-radius:50%;background:var(--card);box-shadow:var(--shadow)}
  .pad .btn{position:absolute;display:flex;align-items:center;justify-content:center;
    width:66px;height:66px;border-radius:50%;color:var(--text);transition:background .12s}
  .pad .btn:active{background:var(--hover)}
  .pad .up{left:73px;top:0}   .pad .down{left:73px;bottom:0}
  .pad .left{left:0;top:73px} .pad .right{right:0;top:73px}
  .pad .ok{left:66px;top:66px;width:80px;height:80px;border-radius:50%;
    background:var(--hover);font-size:16px;font-weight:650;letter-spacing:.03em}
  .pad .ok:active{background:var(--blue-dim);color:var(--blue)}
  .pad svg{width:22px;height:22px;stroke-width:2}

  /* ---- 摇杆（频道 / 音量）---- */
  .pair{display:flex;gap:16px;margin-top:16px}
  .pair .col{flex:1;background:var(--card);border-radius:20px;
    box-shadow:var(--shadow);display:flex;flex-direction:column;
    align-items:center;padding:6px 0}
  .pair .k{width:100%;padding:15px 0;text-align:center;font-size:19px;
    color:var(--text);transition:background .12s}
  .pair .k:active{background:var(--hover)}
  .pair .lbl{font-size:11px;color:var(--dim);letter-spacing:.16em;padding:2px 0}

  /* ---- 数字键盘 ---- */
  .digit{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:16px}
  .digit .d{background:var(--card);border-radius:13px;padding:15px 0;
    text-align:center;font-size:19px;color:var(--text);box-shadow:var(--shadow);
    transition:background .12s,transform .12s;font-variant-numeric:tabular-nums}
  .digit .d:active{background:var(--hover);transform:scale(.96)}
  .digit .d.fn{font-size:14px;color:var(--muted)}
  .card.tap{cursor:pointer}
  .card.tap:active{background:var(--hover)}
  .chev{font-size:12.5px;color:var(--blue)}
  .dim{color:var(--dim);font-size:12px}
  .prog{display:flex;align-items:center;gap:10px;padding:12px 2px;
    border-bottom:1px solid var(--line);font-size:14px}
  .prog:last-child{border-bottom:0}
  .prog .t{color:var(--muted);font-size:12.5px;min-width:46px;
    font-variant-numeric:tabular-nums}
  .prog .ti{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .prog.live .ti{color:var(--blue);font-weight:600}
  .prog.past .ti{color:var(--dim)}
  .prog .act{font-size:12px;color:var(--blue);flex:0 0 auto}
  .prog.disabled{opacity:.55}
</style>
</head>
<body>

<div class="head">
  <div class="grow">
    <h1>MinTV 遥控</h1>
    <div class="sub"><span class="dot" id="dot"></span><span id="conn">连接中…</span></div>
  </div>
  <button class="theme" data-theme-btn onclick="MintvTheme.cycle()">跟随系统</button>
</div>

<div class="navtabs"><a href="/">订阅</a><a href="/scripts">脚本</a><a href="channels.html">频道</a><a href="remote" class="on">遥控</a></div>

<div class="card tap" id="npCard" onclick="toggleEpg()">
  <div class="np">
    <span class="no" id="no">----</span>
    <span class="nm" id="nm">未在播放</span>
  </div>
  <div class="meta">
    <span id="line">线路 -/-</span><span id="res">--</span><span id="spd">--</span>
    <span class="grow"></span>
    <span id="epgChev" class="chev">节目单 ›</span>
  </div>
  <div class="bar"><i id="prog"></i></div>
</div>

<div class="card" id="epgBox" style="display:none">
  <div class="sect" style="margin:0 0 10px">
    <span>节目单</span><span id="epgName" class="dim"></span>
  </div>
  <div id="epgList"></div>
</div>

<div class="quick">
  <div class="q" onclick="cmd('MENU')" title="菜单">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </div>
  <div class="q" onclick="cmd('BACK')" title="返回">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
  </div>
  <div class="q" onclick="cmd('HOME')" title="主页">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linejoin="round"><path d="M4 11l8-7 8 7v9H4z"/></svg>
  </div>
  <div class="q" onclick="cmd('MUTE')" title="静音">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M17 9l4 6M21 9l-4 6" stroke-linecap="round"/></svg>
  </div>
</div>

<div class="pad">
  <div class="btn up" onclick="cmd('UP')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 15l6-6 6 6"/></svg>
  </div>
  <div class="btn down" onclick="cmd('DOWN')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  </div>
  <div class="btn left" onclick="cmd('LEFT')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
  </div>
  <div class="btn right" onclick="cmd('RIGHT')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
  </div>
  <div class="btn ok" onclick="cmd('OK')">OK</div>
</div>

<div class="pair">
  <div class="col">
    <div class="k" onclick="cmd('CH_UP')">+</div>
    <div class="lbl">CH</div>
    <div class="k" onclick="cmd('CH_DOWN')">−</div>
  </div>
  <div class="col">
    <div class="k" onclick="cmd('VOL_UP')">+</div>
    <div class="lbl">VOL</div>
    <div class="k" onclick="cmd('VOL_DOWN')">−</div>
  </div>
</div>

<div class="digit">
  <div class="d" onclick="digit('1')">1</div>
  <div class="d" onclick="digit('2')">2</div>
  <div class="d" onclick="digit('3')">3</div>
  <div class="d" onclick="digit('4')">4</div>
  <div class="d" onclick="digit('5')">5</div>
  <div class="d" onclick="digit('6')">6</div>
  <div class="d" onclick="digit('7')">7</div>
  <div class="d" onclick="digit('8')">8</div>
  <div class="d" onclick="digit('9')">9</div>
  <div class="d fn" onclick="cmd('LINE')">线路</div>
  <div class="d" onclick="digit('0')">0</div>
  <div class="d fn" onclick="digitDel()">←</div>
</div>

<div class="toast" id="toast"></div>

<script src="theme.js"></script>
<script>
var buf = '';
var timer = null;

function toast(s) {
  var t = document.getElementById('toast');
  t.textContent = s; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('on'); }, 1500);
}

function cmd(type, value) {
  MintvApi.cmd(type, value).then(function (r) {
    if (!r || r.ok === false) toast((r && r.msg) || '操作失败');
    setTimeout(refresh, 260);
  }).catch(function () { toast('盒子没有响应'); });
}

// 数字键本地累计，1.2 秒不发就一起提交，和盒子端行为一致
function digit(d) {
  buf += d;
  document.getElementById('no').textContent = buf;
  clearTimeout(timer);
  timer = setTimeout(flushDigit, 1200);
}
function digitDel() {
  buf = buf.slice(0, -1);
  document.getElementById('no').textContent = buf || '----';
  clearTimeout(timer);
  if (buf) timer = setTimeout(flushDigit, 1200);
}
function flushDigit() {
  if (!buf) return;
  var v = buf; buf = '';
  MintvApi.cmd('DIGIT', v).then(function () { setTimeout(refresh, 500); });
}

function refresh() {
  MintvApi.state().then(function (s) {
    if (!s) return;
    document.getElementById('dot').className = 'dot ok';
    document.getElementById('conn').textContent =
        '已连接 · ' + (s.ip || '') + (s.port ? ':' + s.port : '');

    var ch = s.ch || {};
    if (!buf) document.getElementById('no').textContent = ch.no || '----';
    document.getElementById('nm').textContent = ch.name || '未在播放';

    var line = s.line || {};
    document.getElementById('line').textContent =
        '线路 ' + (line.cur || '-') + '/' + (line.total || '-');

    var v = s.video || {};
    document.getElementById('res').textContent = v.res || '--';
    document.getElementById('spd').textContent = s.speed || '--';

    var pg = s.program || {};
    document.getElementById('prog').style.width =
        Math.round((pg.progress || 0) * 100) + '%';

    if (epgOpen) loadEpg();
  }).catch(function () {
    document.getElementById('dot').className = 'dot';
    document.getElementById('conn').textContent = '连接断开';
  });
}

var epgOpen = false;

function toggleEpg() {
  epgOpen = !epgOpen;
  document.getElementById('epgBox').style.display = epgOpen ? '' : 'none';
  document.getElementById('epgChev').textContent = epgOpen ? '收起 ‹' : '节目单 ›';
  if (epgOpen) loadEpg();
}

function loadEpg() {
  fetch('/api/epg', { cache: 'no-store' }).then(function (r) { return r.json(); })
    .then(function (d) {
      document.getElementById('epgName').textContent =
          (d.name || '') + (d.canReplay ? ' · 可回看' : '');
      var list = d.list || [];
      if (!list.length) {
        document.getElementById('epgList').innerHTML =
            '<div class="dim" style="padding:14px 0">这个频道没有节目单</div>';
        return;
      }
      document.getElementById('epgList').innerHTML = list.map(function (p) {
        var cls = 'prog' + (p.live ? ' live' : '') + (p.ended ? ' past' : '');
        var act = '';
        if (p.live) act = '<span class="act">直播中</span>';
        else if (p.replay) act = '<span class="act">回看</span>';
        else if (p.ended) act = '<span class="act disabled">不可回看</span>';
        else act = '<span class="act dim">未开始</span>';
        var click = (p.live || p.replay) ? ' onclick="cmd(\'PROG\',\'' + p.i + '\')"'
                                         : ' class="' + cls + ' disabled"';
        var cl2 = (p.live || p.replay) ? ' class="' + cls + '"' : '';
        return '<div' + cl2 + click + '>' +
               '<span class="t">' + p.time + '</span>' +
               '<span class="ti">' + p.title + '</span>' + act + '</div>';
      }).join('');
    }).catch(function () {
      document.getElementById('epgList').innerHTML =
          '<div class="dim" style="padding:14px 0">读取节目单失败</div>';
    });
}

// 状态每秒刷新；切后台自动停（theme.js 里的 MintvPoll 处理）
MintvPoll(refresh, 1000);
</script>
<script>
// 离开本页前停掉轮询，防止和下一个页面的定时器打架
document.addEventListener('click', function(e){
  var a = e.target.closest && e.target.closest('a[href]');
  if (a && a.getAttribute('href').indexOf('://') < 0 && window.MintvStopPoll) {
    window.MintvStopPoll();
  }
}, true);
window.addEventListener('pagehide', function(){ if (window.MintvStopPoll) window.MintvStopPoll(); });
</script>
</body>
</html>
