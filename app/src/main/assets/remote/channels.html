<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MinTV · 频道</title>
<link rel="stylesheet" href="app.css">
<style>
  /* 分类横向滚动条 */
  .cats{
    display:flex; gap:8px; overflow-x:auto; padding:2px 0 12px;
    -webkit-overflow-scrolling:touch; scrollbar-width:none;
  }
  .cats::-webkit-scrollbar{display:none}
  .cat{
    flex:0 0 auto; padding:9px 15px; border-radius:12px; font-size:13.5px;
    background:var(--card); color:var(--muted); white-space:nowrap;
    box-shadow:var(--shadow); transition:background .15s,color .15s;
  }
  .cat.on{background:var(--blue-dim); color:var(--blue); font-weight:600}
  .cat .c{opacity:.62; margin-left:6px; font-size:12px}
  .cat:active{background:var(--hover)}

  /* 频道行 */
  .ch{
    display:flex; align-items:center; gap:10px;
    padding:14px 16px; background:var(--card); border-radius:12px;
    margin-bottom:8px; box-shadow:var(--shadow); font-size:15px;
    transition:background .12s;
  }
  .ch:active{background:var(--hover)}
  .ch.on{background:var(--blue-dim); border:1px solid var(--blue)}
  .ch.on .nm{color:var(--blue); font-weight:600}
  .ch .no{
    font-size:12px; color:var(--muted); min-width:38px;
    font-variant-numeric:tabular-nums;
  }
  .ch.on .no{color:var(--blue)}
  .ch .main2{flex:1; min-width:0; display:flex; flex-direction:column; gap:3px}
  .ch .nm{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .ch .sub{font-size:11.5px; color:var(--dim); white-space:nowrap;
    overflow:hidden; text-overflow:ellipsis}
  .ch.on .sub{color:var(--blue); opacity:.8}
  .ch .g{font-size:11.5px; color:var(--dim); flex:0 0 auto}
  .ch .live{
    font-size:11px; padding:2px 7px; border-radius:5px;
    background:rgba(46,168,90,.16); color:var(--ok); flex:0 0 auto;
  }
  .count{font-size:12px; color:var(--dim); text-align:right; margin-bottom:6px}

  .searchwrap{position:relative; margin-bottom:12px}
  .searchwrap input{
    width:100%; padding:13px 96px 13px 15px; border-radius:13px; font-size:15px;
    border:1px solid var(--line); background:var(--card); color:var(--text);
    box-shadow:var(--shadow); outline:none;
  }
  .searchwrap input:focus{border-color:var(--blue)}

  /* 范围切换：贴在搜索框右端，像被切出来的一小块 */
  .scopechip{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    display:flex; align-items:center; gap:5px;
    padding:7px 11px; border-radius:9px;
    background:var(--blue-dim); color:var(--blue);
    font-size:12.5px; font-weight:600; user-select:none;
    transition:background .15s;
  }
  .scopechip:active{background:var(--hover)}
  .scopechip svg{width:13px;height:13px;opacity:.75}


  /* 每行的「节目」按钮 */
  .ch .epgbtn{
    flex:0 0 auto; font-size:11.5px; padding:4px 9px; border-radius:7px;
    background:var(--card2); color:var(--muted);
  }
  .ch .epgbtn:active{background:var(--hover)}
  /* 行内展开的节目单 */
  .epgin{grid-column:1/-1; background:var(--card2); border-radius:10px;
    padding:4px 12px; margin:-4px 0 8px; font-size:13px}
  .epgin .p{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
  .epgin .p:last-child{border-bottom:0}
  .epgin .p .t{color:var(--muted);min-width:44px;font-variant-numeric:tabular-nums}
  .epgin .p .ti{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .epgin .p.live .ti{color:var(--blue);font-weight:600}
  .epgin .p.past .ti{color:var(--dim)}
  .epgin .p .a{font-size:11.5px;color:var(--blue)}
</style>
</head>
<body>

<div class="head">
  <div class="grow">
    <h1>频道</h1>
    <div class="sub"><span class="dot" id="dot"></span><span id="conn">连接中…</span></div>
  </div>
  <button class="theme" data-theme-btn onclick="MintvTheme.cycle()">跟随系统</button>
</div>

<div class="navtabs">
  <a href="subs">订阅</a><a class="on">频道</a><a href="remote">遥控</a>
</div>

<div class="card" style="padding:14px 16px;margin-bottom:12px">
  <div class="np" style="display:flex;align-items:center;gap:10px">
    <span class="no" id="no" style="font-size:12.5px;padding:3px 9px;border-radius:7px;
      background:var(--blue-dim);color:var(--blue);font-variant-numeric:tabular-nums">----</span>
    <span id="nm" style="font-size:17px;font-weight:650;flex:1;min-width:0;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis">未在播放</span>
  </div>
</div>

<div class="searchwrap">
  <input id="q" placeholder="搜频道名或节目" autocomplete="off">
  <div class="scopechip" id="scopechip" onclick="cycleScope()">
    <span id="scopeTxt">全部</span>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
  </div>
</div>

<div class="cats" id="cats"></div>
<p class="count" id="count"></p>
<div id="list"></div>

<div class="toast" id="toast"></div>

<script src="theme.js"></script>
<script>
var curCat = 0;
var query = '';
var byScope = 'all';   // all / name / prog
var catsLoaded = false;
var openEpg = {};      // 台号 → true 表示这一行的节目单展开着

function toast(s) {
  var t = document.getElementById('toast');
  t.textContent = s; t.classList.add('on');
  clearTimeout(t._h); t._h = setTimeout(function () { t.classList.remove('on'); }, 1500);
}

function esc(s) {
  return String(s || '').replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

function load(cat) {
  if (typeof cat === 'number') curCat = cat;
  if (query) { doSearch(); return; }
  fetch('/api/channels?cat=' + curCat, { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      document.getElementById('dot').className = 'dot ok';
      renderCats(d.cats || []);
      catsLoaded = true;
      renderList(d.list || [], d.catName || '');
    })
    .catch(function () {
      document.getElementById('dot').className = 'dot';
      document.getElementById('conn').textContent = '连接断开';
    });
}

function renderCats(cats) {
  document.getElementById('cats').innerHTML = cats.map(function (c) {
    return '<div class="cat' + (c.i === curCat ? ' on' : '') +
      '" onclick="load(' + c.i + ')">' + esc(c.name) +
      '<span class="c">' + c.count + '</span></div>';
  }).join('');
}

function doSearch() {
  fetch('/api/search?q=' + encodeURIComponent(query) + '&by=' + byScope,
        { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      document.getElementById('dot').className = 'dot ok';
      // 分类条不能因为进搜索就消失：用户要能随时看清"这个台属于哪个分类"，
      // 也要能一键退回去浏览。
      if (!catsLoaded) load(0);
      var label = byScope === 'name' ? '频道名' : byScope === 'prog' ? '当前节目' : '频道名/节目';
      var n = (d.list || []).length;
      renderList(d.list || [], '「' + query + '」命中 ' + n + ' 个频道 · 按' + label);
    })
    .catch(function () { toast('搜索失败'); });
}

function renderList(list, catName) {
  document.getElementById('conn').textContent = catName
    ? '已连接 · ' + catName + ' · ' + list.length + ' 个'
    : '已连接';
  if (!list.length) {
    document.getElementById('list').innerHTML =
      '<div class="card empty">这个分类下还没有频道</div>';
    return;
  }
  document.getElementById('list').innerHTML = list.map(function (c) {
    // 主行永远是**频道名**（用户要的结果就是"哪些频道名含这个关键字"）；
    // 节目名只作为副行提示，说明它是"因为正在播这个节目"才被搜出来的。
    var sub;
    if (c.prog) {
      sub = (c.live ? '正在播：' : c.progTime ? c.progTime + ' 播出：' : '节目：')
            + esc(c.prog);
    } else {
      sub = esc(c.group);          // 分类：告诉用户这个台属于哪一组
    }
    var html = '<div class="ch' + (c.playing ? ' on' : '') +
      '" onclick="playCh(\'' + c.no + '\')">' +
      '<span class="no">' + c.no + '</span>' +
      '<span class="main2"><span class="nm">' + esc(c.name) + '</span>' +
      '<span class="sub">' + sub + '</span></span>' +
      (c.playing ? '<span class="live">播放中</span>'
                 : '<span class="g">' + esc(c.group) + '</span>') +
      '<span class="epgbtn" onclick="event.stopPropagation();toggleEpg(\'' +
        c.no + '\')">节目</span>' +
      '</div>';
    if (openEpg[c.no]) {
      html += '<div class="epgin" id="e' + c.no + '">' +
        '<div class="p"><span class="t">…</span><span class="ti">读取中</span></div></div>';
      setTimeout(function () { loadEpgFor(c.no); }, 0);
    }
    return html;
  }).join('');
}

function toggleEpg(no) {
  openEpg[no] = !openEpg[no];
  load(curCat);
}

function loadEpgFor(no) {
  fetch('/api/epg?ch=' + no, { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var box = document.getElementById('e' + no);
      if (!box) return;
      var list = d.list || [];
      if (!list.length) {
        box.innerHTML = '<div class="p"><span class="ti">这个频道没有节目单</span></div>';
        return;
      }
      box.innerHTML = list.map(function (p) {
        var cls = 'p' + (p.live ? ' live' : '') + (p.ended ? ' past' : '');
        var a = p.live ? '直播中' : p.replay ? '回看' : p.ended ? '' : '未开始';
        var click = (p.live || p.replay)
          ? ' onclick="event.stopPropagation();cmdProg(\'' + no + '\',' + p.i + ')"'
          : '';
        return '<div class="' + cls + '"' + click + '>' +
          '<span class="t">' + p.time + '</span>' +
          '<span class="ti">' + esc(p.title) + '</span>' +
          (a ? '<span class="a">' + a + '</span>' : '') + '</div>';
      }).join('');
    })
    .catch(function () { });
}

// 点节目单条目：先切到那个台，再播那一档
function cmdProg(no, i) {
  MintvApi.cmd('PLAYCH', no).then(function () {
    setTimeout(function () {
      MintvApi.cmd('PROG', String(i)).then(function () {
        toast('正在切换'); setTimeout(function(){ load(curCat); }, 600);
      });
    }, 900);
  });
}

function playCh(no) {
  MintvApi.cmd('PLAYCH', no).then(function (r) {
    if (r && r.ok === false) toast(r.msg || '切换失败');
    setTimeout(function () { load(); refreshNow(); }, 700);
  }).catch(function () { toast('盒子没有响应'); });
}

// 顶部"正在播放"跟着盒子状态走
function refreshNow() {
  MintvApi.state().then(function (s) {
    if (!s) return;
    var ch = s.ch || {};
    document.getElementById('no').textContent = ch.no || '----';
    document.getElementById('nm').textContent = ch.name || '未在播放';
  }).catch(function () { });
}

/** 点一下循环切换：全部 → 频道名 → 节目 → 全部 */
function cycleScope() {
  byScope = byScope === 'all' ? 'name' : byScope === 'name' ? 'prog' : 'all';
  document.getElementById('scopeTxt').textContent =
      byScope === 'name' ? '频道名' : byScope === 'prog' ? '节目' : '全部';
  var qi = document.getElementById('q');
  qi.placeholder = byScope === 'name' ? '搜频道名，如 CCTV'
                 : byScope === 'prog' ? '搜正在播的节目，如 新闻'
                 : '搜频道名或节目';
  if (query) doSearch();
}

var qi = document.getElementById('q');
var qt = null;
qi.addEventListener('input', function () {
  query = qi.value.trim();
  clearTimeout(qt);
  qt = setTimeout(function () {
    if (query) doSearch();
    else load(curCat);
  }, 280);
});

load(0);
refreshNow();
// 3 秒刷一次列表（别的设备或遥控器可能刚换了台）
MintvPoll(function () { load(); refreshNow(); }, 3000);
</script>
</body>
</html>
