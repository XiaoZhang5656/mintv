name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK
        run: ls "$ANDROID_HOME/platforms" || true

      # runner 自带 debug.keystore 每次都是新的，固定一份保证可覆盖升级
      - name: Stable debug keystore
        run: |
          rm -f app/debug.keystore
          keytool -genkeypair -v -keystore app/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace --console=plain

      - uses: actions/upload-artifact@v4
        with:
          name: tvui-java-debug
          path: app/build/outputs/apk/debug/*.apk

      # git push 到 github.com 在 runner 上常被断，改用 REST API 回写
      - name: Publish APK via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: python3 .ci/publish_apk.py
