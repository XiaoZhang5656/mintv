name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true

      # runner 自带的 debug.keystore 每次都是新的，导致覆盖安装失败。
      # 这里生成一个固定密钥（口令 android/android），保证每次升级都能覆盖安装。
      - name: Create stable debug keystore
        run: |
          rm -f app/debug.keystore
          keytool -genkeypair -v \
            -keystore app/debug.keystore -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tail -80

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tvui-java-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # runner 到 github.com 的 git 通道不稳（443 被断），改用 REST API 回写 APK，
      # 这样 public/apk 下能通过 raw / ghproxy 直链下载。
      - name: Publish APK via API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/*.apk /tmp/tvui-java-debug.apk
          python3 - <<'PY'
          import base64, json, os, urllib.request
          tok = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          path = 'public/apk/tvui-java-debug.apk'
          api = f'https://api.github.com/repos/{repo}/contents/{path}'
          def call(url, method='GET', body=None):
              data = json.dumps(body).encode() if body else None
              req = urllib.request.Request(url, data=data, method=method, headers={
                  'Authorization': 'Bearer ' + tok,
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json'})
              with urllib.request.urlopen(req, timeout=60) as r:
                  raw = r.read().decode()
                  return json.loads(raw) if raw.strip() else None
          sha = None
          try:
              sha = call(api)['sha']
          except Exception:
              pass
          body = {
              'message': 'ci: publish debug apk [skip ci]',
              'content': base64.b64encode(open('/tmp/tvui-java-debug.apk','rb').read()).decode(),
              'branch': 'main',
          }
          if sha:
              body['sha'] = sha
          call(api, 'PUT', body)
          print('published apk', os.path.getsize('/tmp/tvui-java-debug.apk'), 'bytes')
          PY
