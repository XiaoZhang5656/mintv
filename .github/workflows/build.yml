name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android（那个 action 内部会去调 sdkmanager，
      # 在新版 runner 上经常 401/超时）。GitHub 的 ubuntu-latest 镜像自带
      # ANDROID_HOME 和 cmdline-tools，AGP 自己会补 build-tools 和 platform。
      - name: Show preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ls "$ANDROID_HOME" || true
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace --info

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: tvui-java-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
