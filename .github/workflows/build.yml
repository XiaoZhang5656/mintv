name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK
        run: ls "$ANDROID_HOME/platforms" || true

      # runner 自带 debug.keystore 每次都是新的，固定一份保证可覆盖升级
      - name: Stable debug keystore
        run: |
          rm -f app/debug.keystore
          keytool -genkeypair -v -keystore app/debug.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 注意：这里绝对不能接 `| tail`，管道会把 gradle 的非零退出码吞掉，
      # 让「编译失败」显示成「成功」，下一步 cp 才报找不到文件。
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace --console=plain
          echo "---- outputs ----"
          find app/build/outputs -name '*.apk' -type f || true

      - uses: actions/upload-artifact@v4
        with:
          name: tvui-java-debug
          path: app/build/outputs/apk/debug/*.apk

      # git push 到 github.com 在 runner 上常被断，改用 REST API 回写
      # 回写 APK：先试 git push（快），失败再走 Contents API（绕开 443 断连）。
      # 内置 GITHUB_TOKEN 在 permissions: contents: write 下两者都有写权限。
      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p public/apk
          cp app/build/outputs/apk/debug/*.apk public/apk/tvui-java-debug.apk
          ls -la public/apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/apk/tvui-java-debug.apk
          git diff --cached --quiet || git commit -m "ci: publish debug apk [skip ci]"
          git push || python3 .ci/publish_apk.py
