name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 android-actions/setup-android（内部调 sdkmanager，在 runner 上易 401/超时）。
      # ubuntu-latest 镜像自带 ANDROID_HOME 与 cmdline-tools，AGP 会自己补 platform。
      - name: Show preinstalled Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms" || true
          ls "$ANDROID_HOME/build-tools" || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: tvui-java-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

      # 额外把 APK 放回仓库 public/apk/，这样 raw.githubusercontent.com 可以直链下载，
      # 不依赖 artifact 的 Azure 鉴权跳转。
      - name: Publish APK to public/apk
        run: |
          mkdir -p public/apk
          cp app/build/outputs/apk/debug/*.apk public/apk/tvui-java-debug.apk
          ls -la public/apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/apk/tvui-java-debug.apk
          git diff --cached --quiet || git commit -m "ci: publish debug apk [skip ci]"
          git push
