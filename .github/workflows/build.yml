name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assemble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:

      # P2P 分片加密的密钥放在 libmintvcrypt.so 里，要 NDK 才能编。
      # 版本必须跟 app/build.gradle 的 ndkVersion 一致。
      - name: Setup NDK
        run: |
          echo "y" | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager \
            --install "ndk;26.1.10909125" > /dev/null
          echo "NDK 安装完成: $(ls $ANDROID_SDK_ROOT/ndk)"
        shell: bash
      - uses: actions/checkout@v4
        with:
          # gen_version.py 从 git log 生成更新日志，只抓最近 1 个 commit 会拿不到历史
          fetch-depth: 60

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show Android SDK
        run: ls "$ANDROID_HOME/platforms" || true

      # 签名用仓库里的 app/mintv.keystore（固定），不再每次现场生成。
      # 现场生成的后果：每次 SHA256 不同 → 必须卸载才能装新版。

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      # 注意：这里绝对不能接 `| tail`，管道会把 gradle 的非零退出码吞掉，
      # 让「编译失败」显示成「成功」，下一步 cp 才报找不到文件。
      - name: Build debug APK
        run: |
          set -o pipefail
          # 必须用 release：AGP 强制禁止 debuggable 变体做混淆
          #   WARNING: BuildType 'debug' is both debuggable and has
          #   'isMinifyEnabled' set to true. ...obfuscation will be disabled.
          # 之前一直打 debug，所以代码从未真正混淆过（只有资源压缩生效）。
          gradle assembleRelease --no-daemon --stacktrace --console=plain
          echo "---- outputs ----"
          find app/build/outputs -name '*.apk' -type f || true

      - uses: actions/upload-artifact@v4
        with:
          name: tvui-java-release
          path: app/build/outputs/apk/release/*.apk

      # git push 到 github.com 在 runner 上常被断，改用 REST API 回写
      # 回写 APK：先试 git push（快），失败再走 Contents API（绕开 443 断连）。
      # 内置 GITHUB_TOKEN 在 permissions: contents: write 下两者都有写权限。
      # 混淆验证：debug 变体不能混淆（AGP 强制），改 release 后必须确认
      # R8 真的改了名，否则又会出现"以为混淆了其实没有"。
      - name: Verify obfuscation
        run: |
          M=app/build/outputs/mapping/release/mapping.txt
          if [ ! -f "$M" ]; then echo "::error::没有 mapping.txt，R8 没跑"; exit 1; fi
          TOTAL=$(grep -c ' -> ' "$M" || true)
          RENAMED=$(grep -cE '^[a-z0-9.]+ -> [a-z0-9]+(\.[a-z0-9]+)*:$' "$M" || true)
          echo "mapping 总行数: $(wc -l < "$M")"
          echo "类映射条数:   $TOTAL"
          echo "--- 前 8 条映射 ---"
          grep ' -> ' "$M" | head -8
          if [ "$TOTAL" -lt 100 ]; then
            echo "::error::映射条数只有 $TOTAL，混淆可能没生效"
            exit 1
          fi
          echo "OK: R8 已混淆"

      - name: Publish APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p public/apk
          # release 产物叫 app-<abi>-release.apk，但已发布的下载链接是
          # app-<abi>-debug.apk。改名保持链接稳定（文件名只是历史遗留标识）。
          for f in app/build/outputs/apk/release/*.apk; do
            base=$(basename "$f")
            abi=${base#app-}
            abi=${abi%-release.apk}
            cp "$f" "public/apk/app-${abi}-debug.apk"
          done
          rm -f public/apk/*-release.apk
          ls -la public/apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/apk
          git diff --cached --quiet || git commit -m "ci: publish debug apk [skip ci]"
          git push || python3 .ci/publish_apk.py

      # 把 APK 同步到一个**公开**仓库。
      #
      # 主仓库转私有之后，raw.githubusercontent / ghproxy / jsDelivr 对它的
      # 所有文件都会返回 401 —— 用户就下不到包了。所以产物单独放公开仓库：
      # 代码私有，分发包公开，两边互不影响。
      #
      # 需要：
      #   1. 建一个公开仓库 <owner>/mintv-apk
      #   2. 生成一个有 repo 权限的 PAT，存进 Secrets 名为 APK_REPO_TOKEN
      # 没配 token 就跳过，不影响主流程（转私有之前本来也不需要）。
      # 从 git log 生成 version.json，客户端「检测更新」读的就是它
      - name: Generate version.json
        run: |
          python3 .ci/gen_version.py
          echo '--- version.json ---'
          head -c 800 public/version.json

      - name: Mirror APK to public repo
        env:
          APK_TOKEN: ${{ secrets.APK_REPO_TOKEN }}
        run: |
          if [ -z "$APK_TOKEN" ]; then
            echo "未配置 APK_REPO_TOKEN，跳过同步"
            exit 0
          fi
          OWNER="${GITHUB_REPOSITORY%%/*}"
          # 先在本仓库根目录读出当前版本号，进 /tmp 之后就找不到了
          VERSION=$(sed -n 's/.*versionName "\([^"]*\)".*/\1/p' app/build.gradle | head -1)
          [ -n "$VERSION" ] || VERSION="unknown"
          DEST="https://x-access-token:${APK_TOKEN}@github.com/${OWNER}/mintv-apk.git"
          rm -rf /tmp/apk-mirror
          if ! git clone --depth 1 "$DEST" /tmp/apk-mirror 2>/dev/null; then
            echo "::error::克隆 mintv-apk 失败：仓库不存在或 token 无权限"
            exit 1
          fi
          mkdir -p /tmp/apk-mirror
          cp public/apk/*.apk /tmp/apk-mirror/
          cp public/version.json /tmp/apk-mirror/version.json
          cd /tmp/apk-mirror
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "APK 无变化，跳过提交"
          else
            git commit -m "apk: v$VERSION"
            # force push：只保留最新一份 APK。
            #
            # 每个包 48MB，正常提交的话 10 个版本就 480MB、50 个版本 2.4GB，
            # GitHub 会警告影响拉取。产物仓库的历史本来也没有价值，
            # 覆盖掉最省事，仓库体积永远是 48MB 上下。
            git push --force origin HEAD:main
            echo "已同步到公开仓库（覆盖式）"
          fi
